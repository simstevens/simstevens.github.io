<style>
  /* Muted accent, the same mix the theme uses for the date/author line of posts. */
  :root {
    --accent-muted: color-mix(in srgb, var(--accent), transparent 30%);
  }

  /* One shared style for all buttons: outlined pill with a lift-on-hover animation. */
  a.button,
  a.read-more,
  a.read-more:hover,
  a.read-more:active,
  span.button,
  .header .menu--mobile .menu__trigger {
    border: 1px solid currentColor;
    border-radius: 999px;
    background: transparent;
    color: var(--color);
    padding: 0.5rem 1rem;
    font-weight: normal;
    line-height: 1;
    text-decoration: none;
  }

  a.button,
  a.read-more,
  span.button {
    display: inline-flex;
    align-items: center;
  }

  span.button a {
    padding: 0;
    color: inherit;
  }

  a.button,
  a.read-more,
  span.button,
  .header .menu--mobile .menu__trigger,
  .social-link {
    transition: transform 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }

  a.button:hover,
  a.button:focus-visible,
  a.read-more:hover,
  a.read-more:focus-visible,
  span.button:hover,
  span.button:focus-within,
  .header .menu--mobile .menu__trigger:hover,
  .social-link:hover,
  .social-link:focus-visible {
    background: transparent;
    color: var(--accent);
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
  }

  /* Rounded logo, matching the pill buttons. */
  .header .logo {
    background: var(--accent-muted);
    border-radius: 999px;
    padding: 5px 14px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .header__logo a:hover .logo,
  .header__logo a:focus-visible .logo {
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
  }

  /* Row of dots next to the logo, replacing the theme's vertical stripes. */
  .header__logo:after {
    background: radial-gradient(circle, var(--accent-muted) 2.5px, transparent 3px) left center / 14px 14px;
    background-repeat: space no-repeat;
    margin-left: 6px;
  }

  /* Logo, dots and menu bar in one row; the menu wraps below when space runs out. */
  .header {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px 6px;
    margin-bottom: 20px;
  }

  .header__inner {
    flex: 1 1 200px;
  }

  .header .navigation-menu {
    flex: 0 0 auto;
    margin: 0;
  }

  /* Framed boxes: corner radius = inner photo radius (16px) + frame padding (20px). */
  .framed {
    border-radius: 36px;
  }

  /* Desktop menu as one rounded bar; the current page is a filled pill inside it. */
  .navigation-menu__inner.menu--desktop {
    flex: 0 1 auto;
    align-items: center;
    gap: 0.25rem;
    padding: 0.3rem;
    border: 1px solid var(--accent-muted);
    border-radius: 1.5rem;
    color: var(--color);
  }

  .navigation-menu__inner.menu--desktop > li {
    margin: 0 !important;
  }

  .navigation-menu__inner.menu--desktop > li > a {
    display: inline-block;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    color: var(--color) !important;
    text-decoration: none;
    transition: transform 0.2s ease, color 0.2s ease, background 0.2s ease;
  }

  .navigation-menu__inner.menu--desktop > li > a:hover,
  .navigation-menu__inner.menu--desktop > li > a:focus-visible {
    color: var(--accent) !important;
    transform: scale(1.08);
  }

  .navigation-menu__inner.menu--desktop > li > a.menu-link--active {
    background: var(--accent-muted);
    color: var(--accent-contrast-color) !important;
  }

  /* Phone menu: trigger and dropdown panel in the same style as the desktop menu bar. */
  .header .menu--mobile .menu__trigger {
    border-color: var(--accent-muted);
  }

  .menu--mobile .menu__dropdown {
    top: calc(100% + 8px);
    left: auto;
    right: 0;
    min-width: 11rem;
    gap: 0.2rem;
    padding: 0.4rem;
    border: 1px solid var(--accent-muted);
    border-radius: 1.25rem;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
  }

  .menu--mobile .menu__dropdown > li {
    margin: 0 !important;
    padding: 0;
  }

  .menu--mobile .menu__dropdown > li > a {
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    color: var(--color) !important;
    text-decoration: none;
    transition: transform 0.2s ease, color 0.2s ease;
  }

  .menu--mobile .menu__dropdown > li > a:hover,
  .menu--mobile .menu__dropdown > li > a:focus-visible {
    color: var(--accent) !important;
    transform: scale(1.08);
  }

  .menu--mobile .menu__dropdown > li > a.menu-link--active {
    background: var(--accent-muted);
    color: var(--accent-contrast-color) !important;
  }

  /* Larger titles on the simple pages (Publications, Presentations, Teaching, About). */
  .headings--one-size .page-title {
    font-size: 2rem;
  }

  /* Timeline (Teaching and Presentations): h3 headings are dots on a vertical line. */
  .page-content--teaching,
  .page-content--talks {
    position: relative;
    padding-left: 2rem;
  }

  .page-content--teaching::before,
  .page-content--talks::before {
    content: "";
    position: absolute;
    top: 0.5rem;
    bottom: 0.5rem;
    left: 0.45rem;
    width: 2px;
    border-radius: 999px;
    background: var(--accent-muted);
  }

  .page-content--teaching h3,
  .page-content--talks h3 {
    position: relative;
    display: inline-block;
    margin: 2rem 0 0.8rem;
    padding: 0.3rem 0.9rem;
    border-radius: 999px;
    background: var(--accent-muted);
    color: var(--accent-contrast-color);
    font-size: 1rem;
  }

  .page-content--teaching h3:first-child,
  .page-content--talks h3:first-child {
    margin-top: 0;
  }

  .page-content--teaching h3::before,
  .page-content--talks h3::before {
    content: "";
    position: absolute;
    top: 50%;
    left: calc(-2rem + 0.45rem + 1px);
    width: 14px;
    height: 14px;
    border: 3px solid var(--background);
    border-radius: 999px;
    background: var(--accent);
    transform: translate(-50%, -50%);
  }

  .page-content--teaching ul {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .page-content--teaching li {
    margin: 0;
    padding: 0;
  }

  .page-content--teaching li::before {
    content: none;
  }

  .page-content--teaching .course-card {
    display: inline-block;
    margin: 0;
    padding: 0.6rem 1.1rem;
    border: 1px solid var(--accent-muted);
    border-radius: 1rem;
    background: transparent;
    color: var(--color);
    font: inherit;
    font-weight: normal;
    cursor: pointer;
    transition: transform 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }

  .page-content--teaching .course-card:hover,
  .page-content--teaching .course-card:focus-visible {
    background: transparent;
    color: var(--accent);
    transform: translateY(-4px) scale(1.04);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
  }

  /* Presentations and publications: each list item is a card. */
  .page-content--talks ul,
  .page-content--publications ul {
    display: grid;
    gap: 1rem;
    margin: 0 0 1rem;
    padding: 0;
    list-style: none;
  }

  .page-content--talks li,
  .page-content--publications li {
    margin: 0;
    padding: 1rem 1.3rem;
    border: 1px solid var(--accent-muted);
    border-radius: 1.25rem;
    color: color-mix(in srgb, var(--color), transparent 25%);
  }

  .page-content--talks li::before,
  .page-content--publications li::before {
    content: none;
  }

  .page-content--talks li p,
  .page-content--publications li p {
    margin: 0;
  }

  .page-content--talks li strong,
  .page-content--publications li strong {
    color: var(--accent);
  }

  /* Links inside the cards become small pill buttons. */
  .page-content--talks li a,
  .page-content--publications li a {
    display: inline-block;
    margin: 0.2rem 0;
    padding: 0.15rem 0.7rem;
    border: 1px solid currentColor;
    border-radius: 999px;
    color: var(--color) !important;
    text-decoration: none;
    transition: transform 0.2s ease, color 0.2s ease;
  }

  .page-content--talks li a:hover,
  .page-content--talks li a:focus-visible,
  .page-content--publications li a:hover,
  .page-content--publications li a:focus-visible {
    color: var(--accent) !important;
    transform: scale(1.06);
  }

  /* Emphasised text in a talk card (e.g. *Poster Presentation*) is shown as a tag. */
  .page-content--talks li em {
    display: inline-block;
    margin: 0.2rem 0;
    padding: 0.1rem 0.6rem;
    border-radius: 999px;
    background: var(--accent-muted);
    color: var(--accent-contrast-color);
    font-size: 0.85rem;
    font-style: normal;
  }

  /* Course details pop-up (native popover, centred by the browser). */
  .course-popover {
    width: min(26rem, calc(100vw - 2rem));
    padding: 1.5rem;
    border: 1px solid var(--accent-muted);
    border-radius: 1.5rem;
    background: var(--background);
    color: var(--color);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  }

  .course-popover::backdrop {
    background: rgba(0, 0, 0, 0.5);
  }

  .page-content .course-popover h4 {
    margin: 0;
    color: var(--accent);
    font-size: 1.2rem;
  }

  .course-popover__term {
    margin: 0.3rem 0 1rem;
    color: var(--accent-muted);
  }

  .course-popover dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.4rem 1rem;
    margin: 0 0 1.25rem;
  }

  .course-popover dt {
    color: var(--accent-muted);
  }

  .course-popover dd {
    margin: 0;
  }

  .course-popover .course-popover__close {
    display: inline-flex;
    margin: 0;
    padding: 0.5rem 1rem;
    border: 1px solid currentColor;
    border-radius: 999px;
    background: transparent;
    color: var(--color);
    font-weight: normal;
    line-height: 1;
    transition: transform 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }

  .course-popover .course-popover__close:hover,
  .course-popover .course-popover__close:focus-visible {
    background: transparent;
    color: var(--accent);
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
  }

  @media (max-width: 900px) {
    .navigation-menu__inner.menu--desktop {
      gap: 0;
    }

    .navigation-menu__inner.menu--desktop > li > a {
      padding: 0.35rem 0.55rem;
      font-size: 0.9rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    a.button,
    a.read-more,
    span.button,
    .header .menu--mobile .menu__trigger,
    .social-link {
      transition: color 0.2s ease;
    }

    a.button:hover,
    a.button:focus-visible,
    a.read-more:hover,
    a.read-more:focus-visible,
    span.button:hover,
    span.button:focus-within,
    .header .menu--mobile .menu__trigger:hover,
    .social-link:hover,
    .social-link:focus-visible,
    .header__logo a:hover .logo,
    .header__logo a:focus-visible .logo,
    .navigation-menu__inner.menu--desktop > li > a:hover,
    .navigation-menu__inner.menu--desktop > li > a:focus-visible,
    .menu--mobile .menu__dropdown > li > a:hover,
    .menu--mobile .menu__dropdown > li > a:focus-visible,
    .page-content--teaching .course-card:hover,
    .page-content--teaching .course-card:focus-visible,
    .course-popover .course-popover__close:hover,
    .course-popover .course-popover__close:focus-visible,
    .page-content--talks li a:hover,
    .page-content--talks li a:focus-visible,
    .page-content--publications li a:hover,
    .page-content--publications li a:focus-visible {
      transform: none;
    }
  }
</style>
